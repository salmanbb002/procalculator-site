<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="Illustration of a VAT receipt with a percentage badge and coins">
  <defs>
    <linearGradient id="bgv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#045cb4"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgv)"/>
  <circle cx="90" cy="340" r="140" fill="#ffffff" opacity="0.07"/>
  <circle cx="730" cy="60" r="110" fill="#ffffff" opacity="0.08"/>

  <!-- receipt -->
  <g transform="translate(300,70)">
    <rect x="0" y="0" width="200" height="260" rx="10" fill="#ffffff"/>
    <polygon points="0,260 14,246 28,260 42,246 56,260 70,246 84,260 98,246 112,260 126,246 140,260 154,246 168,260 182,246 200,260 200,280 0,280" fill="#ffffff"/>
    <rect x="24" y="30" width="152" height="12" rx="4" fill="#d7deea"/>
    <rect x="24" y="56" width="110" height="10" rx="4" fill="#e8ecf5"/>
    <rect x="24" y="80" width="130" height="10" rx="4" fill="#e8ecf5"/>
    <rect x="24" y="104" width="90" height="10" rx="4" fill="#e8ecf5"/>
    <line x1="24" y1="132" x2="176" y2="132" stroke="#d7deea" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="24" y="150" width="80" height="12" rx="4" fill="#0f172a" opacity="0.7"/>
    <rect x="120" y="150" width="56" height="12" rx="4" fill="#045cb4"/>
    <rect x="24" y="176" width="60" height="10" rx="4" fill="#94a3b8"/>
    <rect x="120" y="176" width="56" height="10" rx="4" fill="#94a3b8"/>
  </g>

  <!-- percent badge -->
  <circle cx="540" cy="150" r="52" fill="#ffffff"/>
  <circle cx="540" cy="150" r="52" fill="none" stroke="#764ba2" stroke-width="4"/>
  <text x="540" y="164" font-family="'Outfit',sans-serif" font-size="38" font-weight="700" fill="#764ba2" text-anchor="middle">%</text>

  <!-- coins -->
  <circle cx="200" cy="150" r="26" fill="#ffd166" stroke="#e8b23d" stroke-width="3"/>
  <circle cx="230" cy="190" r="20" fill="#ffd166" stroke="#e8b23d" stroke-width="3"/>
  <circle cx="600" cy="290" r="22" fill="#ffd166" stroke="#e8b23d" stroke-width="3"/>
</svg>
